<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class IX Study App - Sindh Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e2a3a, #2c3e50);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: white;
            border-radius: 25px;
            max-width: 550px;
            width: 100%;
            padding: 25px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            min-height: 550px;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #f39c12, #e74c3c, #8e44ad, #3498db);
        }

        /* ===== SCREEN 1: MAIN MENU ===== */
        #menuScreen { display: block; }
        #menuScreen.hidden { display: none; }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 26px;
            color: #2c3e50;
            font-weight: 800;
        }
        .header h1 span { color: #f39c12; }
        .header p {
            color: #7f8c8d;
            font-size: 12px;
            margin-top: 2px;
        }

        .greeting {
            background: #f0f4f8;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 18px;
        }
        .greeting h2 {
            color: #2c3e50;
            font-size: 17px;
        }
        .greeting h2 span { color: #e74c3c; }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .subject-btn {
            border: none;
            padding: 14px 6px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .subject-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .subject-btn:active { transform: scale(0.96); }
        .subject-btn:nth-child(1) { background: #ff6b6b; color: white; }
        .subject-btn:nth-child(2) { background: #feca57; color: #2c3e50; }
        .subject-btn:nth-child(3) { background: #48dbfb; color: #2c3e50; }
        .subject-btn:nth-child(4) { background: #1dd1a1; color: white; }
        .subject-btn:nth-child(5) { background: #5f27cd; color: white; }
        .subject-btn:nth-child(6) { background: #f368e0; color: white; }
        .subject-btn:nth-child(7) { background: #ff9f43; color: white; }

        /* ===== SCREEN 2: ENGLISH SUBJECT SCREEN ===== */
        #englishScreen { display: none; }
        #englishScreen.active { display: block; }

        .screen-title {
            font-size: 20px;
            color: #2c3e50;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2px;
        }
        .screen-subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .back-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .back-btn:hover {
            background: #2c3e50;
            transform: scale(1.02);
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .option-btn {
            padding: 20px 8px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .option-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.words {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        .option-btn.fair {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
        }

        /* ===== UNITS SCREEN ===== */
        #unitsScreen { display: none; }
        #unitsScreen.active { display: block; }

        .unit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }
        .unit-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 10px;
            background: #8e44ad;
            color: white;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .unit-btn:hover {
            transform: scale(1.05);
            background: #9b59b6;
        }
        .unit-btn:active { transform: scale(0.95); }

        /* ===== WORDS DISPLAY ===== */
        #wordsDisplay {
            display: none;
            margin-top: 8px;
        }
        #wordsDisplay.active { display: block; }

        .letter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .letter-tab {
            background: #3498db;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        .letter-tab:hover {
            background: #2980b9;
            transform: scale(1.05);
        }
        .letter-tab.active { background: #f39c12; }
        .letter-tab.empty { opacity: 0.4; }

        .letter-badge {
            display: inline-block;
            background: #f39c12;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .word-item {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            padding: 5px 8px;
            background: #f8f9fa;
            margin-bottom: 3px;
            border-radius: 6px;
            border-left: 3px solid #f39c12;
            font-size: 12px;
            gap: 4px;
            align-items: center;
        }
        .word-item .word {
            font-weight: 700;
            color: #2c3e50;
            font-size: 13px;
        }
        .word-item .sindhi {
            color: #e74c3c;
            font-size: 13px;
            font-family: 'Noto Nastaliq Urdu', 'Segoe UI', sans-serif;
        }
        .word-item .urdu {
            color: #27ae60;
            font-size: 13px;
            font-family: 'Noto Nastaliq Urdu', 'Segoe UI', sans-serif;
        }
        .word-item .meaning {
            color: #7f8c8d;
            font-size: 11px;
            grid-column: 1 / -1;
            border-top: 1px dashed #eee;
            padding-top: 3px;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 25px 15px;
            color: #bdc3c7;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .empty-state h3 {
            color: #95a5a6;
            border: none;
            font-size: 16px;
        }

        /* ===== OTHER SUBJECTS SCREEN ===== */
        #otherScreen { display: none; }
        #otherScreen.active { display: block; }

        .words-scroll {
            max-height: 280px;
            overflow-y: auto;
        }
        .words-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .words-scroll::-webkit-scrollbar-thumb {
            background: #bdc3c7;
            border-radius: 10px;
        }

        .word-count {
            text-align: center;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 6px;
            background: #ecf0f1;
            padding: 3px;
            border-radius: 8px;
            font-weight: 600;
        }

        .language-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .lang-btn {
            padding: 4px 16px;
            border: 2px solid #3498db;
            border-radius: 20px;
            background: transparent;
            color: #3498db;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .lang-btn.active {
            background: #3498db;
            color: white;
        }
        .lang-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 450px) {
            .app-container { padding: 12px 10px; }
            .subject-grid { gap: 5px; }
            .subject-btn { font-size: 12px; padding: 10px 4px; }
            .header h1 { font-size: 18px; }
            .option-btn { font-size: 14px; padding: 16px 6px; }
            .unit-grid { grid-template-columns: 1fr 1fr; }
            .word-item {
                grid-template-columns: 1fr 1fr;
                font-size: 11px;
                padding: 4px 6px;
            }
            .word-item .meaning { display: none; }
            .word-item .sindhi { font-size: 12px; }
            .word-item .urdu { font-size: 12px; }
        }
    </style>
</head>

<div class="app-container" id="app">

    <!-- ========================================= -->
    <!-- SCREEN 1: MAIN MENU -->
    <!-- ========================================= -->
    <div id="menuScreen">

    <!-- ========================================= -->
    <div id="englishScreen">

        <!-- Units Display -->
        <div id="unitsScreen">
            <div class="screen-subtitle" style="margin-bottom:6px;">Select a Unit / Lesson</div>

            </div>
        </div>

        <!-- Words Display -->
        <div id="wordsDisplay">
            <div id="wordCount" class="word-count">📚 0 words</div>
            <div class="language-toggle">
                <button class="lang-btn active" onclick="toggleLanguage('sindhi')" id="langSindhi">🇵🇰 Sindhi</button>
                <button class="lang-btn" onclick="toggleLanguage('urdu')" id="langUrdu">🇵🇰 Urdu</button>
            </div>
            <div class="letter-tabs" id="letterTabs"></div>
            <div id="letterContent"></div>
        </div>

        <!-- Fair Display (Empty) -->
        <div id="fairDisplay" style="display:none;">
            <div class="empty-state">
                <div class="icon">🎪</div>
                <h3>Fair</h3>
                <p style="color: #95a5a6; font-size: 13px;">Nothing to show here yet!</p>
                <p style="color: #bdc3c7; font-size: 11px;">Coming soon...</p>
            </div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- SCREEN 3: OTHER SUBJECTS -->
    <!-- ========================================= -->
    <div id="otherScreen">
        <div class="screen-title" id="otherTitle">📚 Subject</div>
        <div class="screen-subtitle">Content coming soon!</div>
        <button class="back-btn" onclick="goBackToMenu()">⬅ Back to Menu</button>
        <div class="empty-state">
            <div class="icon">🚧</div>
            <h3>Under Construction</h3>
            <p style="color: #95a5a6; font-size: 14px;">📝 This subject is being prepared</p>
            <p style="color: #bdc3c7; font-size: 12px;">Stay tuned, Hassan 👨‍🎓</p>
        </div>
    </div>

</div>

    // ===== SCREEN MANAGEMENT =====
    function showScreen(screenId) {
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('englishScreen').classList.remove('active');
        document.getElementById('otherScreen').classList.remove('active');
        document.getElementById('unitsScreen').classList.remove('active');
        document.getElementById('wordsDisplay').classList.remove('active');
        
        if (screenId === 'menu') {
            document.getElementById('menuScreen').style.display = 'block';
        } else if (screenId === 'english') {
            document.getElementById('englishScreen').classList.add('active');
            document.getElementById('unitsScreen').classList.add('active');
            document.getElementById('wordsDisplay').classList.remove('active');
            document.getElementById('fairDisplay').style.display = 'none';
        } else if (screenId === 'other') {
            document.getElementById('otherScreen').classList.add('active');
        }
    }

    function goBackToMenu() {
        showScreen('menu');
    }

    function openEnglish() {
        showScreen('english');
    }

    function openOther(subject) {
        document.getElementById('otherTitle').textContent = '📚 ' + subject;
        showScreen('other');
    }

    function showUnits() {
        document.getElementById('unitsScreen').classList.add('active');
        document.getElementById('wordsDisplay').classList.remove('active');
        document.getElementById('fairDisplay').style.display = 'none';
    }

    function showFair() {
        document.getElementById('unitsScreen').classList.remove('active');
        document.getElementById('wordsDisplay').classList.remove('active');
        document.getElementById('fairDisplay').style.display = 'block';
    }

    function countWords(wordObj) {
        let count = 0;
        for (let letter in wordObj) {
            count += wordObj[letter].length;
        }
        return count;
    }

    function toggleLanguage(lang) {
        currentLanguage = lang;
        document.getElementById('langSindhi').classList.toggle('active', lang === 'sindhi');
        document.getElementById('langUrdu').classList.toggle('active', lang === 'urdu');
        // Refresh current letter view
        const activeTab = document.querySelector('.letter-tab.active');
        if (activeTab) {
            showLetter(activeTab.textContent);
        } else {
            showLetter('A');
        }
    }

    function showUnitWords(unitNumber) {
        document.getElementById('unitsScreen').classList.remove('active');
        document.getElementById('wordsDisplay').classList.add('active');
        document.getElementById('fairDisplay').style.display = 'none';
        
        currentUnit = unitNumber;
        const wordData = unitWordLists[unitNumber] || {};
        currentWords = wordData;
        
        const totalWords = countWords(wordData);
        document.getElementById('wordCount').textContent = '📚 ' + totalWords + ' words • ' + unitNames[unitNumber];
        
        generateLetterTabs();
        
        let firstLetter = 'A';
        for (let letter of letters) {
            if (wordData[letter] && wordData[letter].length > 0) {
                firstLetter = letter;
                break;
            }
        }
        showLetter(firstLetter);
    }

    function generateLetterTabs() {
        const container = document.getElementById('letterTabs');
        let html = '';
        letters.forEach(letter => {
            const hasWords = currentWords[letter] && currentWords[letter].length > 0;
            const cls = hasWords ? 'letter-tab' : 'letter-tab empty';
            html += `<button class="${cls}" onclick="showLetter('${letter}')">${letter}</button>`;
        });
        container.innerHTML = html;
    }

    function showLetter(letter) {
        const container = document.getElementById('letterContent');
        const words = currentWords[letter] || [];
        
        document.querySelectorAll('.letter-tab').forEach(tab => {
            tab.classList.remove('active');
            if (tab.textContent === letter) {
                tab.classList.add('active');
            }
        });

        let html = `<span class="letter-badge">${letter}</span>`;
        html += `<div class="words-scroll">`;
        if (words.length === 0) {
            html += `<div class="empty-state" style="padding:15px;"><p style="color:#95a5a6;font-size:13px;">No words for ${letter}</p></div>`;
        } else {
            words.forEach(item => {
                const translation = currentLanguage === 'sindhi' ? item.sindhi : item.urdu;
                const langLabel = currentLanguage === 'sindhi' ? '🇵🇰' : '🇵🇰';
                html += `<div class="word-item">
                            <span class="word">${item.word}</span>
                            <span class="${currentLanguage}">${langLabel} ${translation}</span>
                            <span class="meaning">${item.meaning}</span>
                        </div>`;
            });
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    // ===== INIT =====
    showScreen('menu');
