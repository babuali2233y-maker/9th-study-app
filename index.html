<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PUBG 30 Day Content Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090d;--card:#10151d;--line:#252d38;--text:#f5f7fa;--muted:#9da7b5;--accent:#b7ff00;--accent2:#00e5ff;--danger:#ff3b5c}
body{font-family:Inter,system-ui,Arial,sans-serif;background:
radial-gradient(circle at 15% 0%,rgba(183,255,0,.13),transparent 30%),
radial-gradient(circle at 90% 10%,rgba(0,229,255,.12),transparent 28%),var(--bg);
color:var(--text);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:35px 35px}
header{position:relative;padding:34px 18px 24px;text-align:center}
.badge{display:inline-block;border:1px solid rgba(183,255,0,.45);padding:7px 12px;border-radius:999px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.5px;background:rgba(183,255,0,.07)}
h1{font-size:clamp(30px,8vw,62px);line-height:.95;margin:14px 0 10px;font-weight:1000;letter-spacing:-2px;text-transform:uppercase}
h1 span{color:var(--accent);text-shadow:0 0 24px rgba(183,255,0,.35)}
.sub{color:var(--muted);max-width:650px;margin:auto;font-size:14px}
.controls{position:relative;max-width:1100px;margin:10px auto 25px;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{border:1px solid var(--line);background:#121821;color:var(--text);padding:11px 15px;border-radius:12px;font-weight:800;cursor:pointer;transition:.2s}
button:hover,button.active{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.grid{position:relative;max-width:1100px;margin:auto;padding:0 16px 45px;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}
.card{position:relative;background:linear-gradient(145deg,rgba(20,26,35,.97),rgba(10,13,18,.97));border:1px solid var(--line);border-radius:20px;padding:18px;overflow:hidden;min-height:285px;transition:.3s;animation:rise .55s both}
.card:hover{transform:translateY(-6px);border-color:rgba(183,255,0,.6);box-shadow:0 15px 45px rgba(0,0,0,.35),0 0 25px rgba(183,255,0,.08)}
.card:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-55px;top:-55px;background:rgba(183,255,0,.08);filter:blur(5px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.day{font-size:12px;font-weight:1000;color:#0a0d0f;background:var(--accent);padding:6px 9px;border-radius:8px}
.type{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase}
h2{font-size:21px;margin-bottom:9px}
.hook{color:var(--accent2);font-weight:850;font-size:14px;margin-bottom:12px}
.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:900;margin-top:10px}
p{font-size:13px;line-height:1.5;color:#d3d8df}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:10px;border:1px solid #303946;border-radius:999px;padding:5px 8px;color:#b9c2ce}
.actions{display:flex;gap:7px;margin-top:16px}
.actions button{font-size:11px;padding:8px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.box{width:min(620px,100%);max-height:85vh;overflow:auto;background:#10151d;border:1px solid #35404e;border-radius:22px;padding:22px;box-shadow:0 25px 80px #000}
.box h2{font-size:25px}.close{float:right}
textarea{width:100%;min-height:230px;margin-top:15px;background:#080b10;color:#e9edf2;border:1px solid #2d3642;border-radius:12px;padding:13px;resize:vertical;font:13px/1.55 monospace}
footer{text-align:center;color:#697381;font-size:11px;padding:0 15px 30px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.card{min-height:0}h1{font-size:38px}}
</style>
</head>
<body>
<header>
  <div class="badge">🎮 PUBG CREATOR MODE</div>
  <h1>30 DAYS <span>OF CLUTCH</span></h1>
  <div class="sub">A modern PUBG-only TikTok content calendar with hooks, video ideas, editing directions and captions.</div>
</header>

<div class="controls">
  <button class="active" onclick="filterCards('all',this)">ALL</button>
  <button onclick="filterCards('clutch',this)">CLUTCH</button>
  <button onclick="filterCards('funny',this)">FUNNY</button>
  <button onclick="filterCards('sniper',this)">SNIPER</button>
  <button onclick="filterCards('challenge',this)">CHALLENGE</button>
</div>

<main class="grid" id="grid"></main>
<footer>Tip: Use your own gameplay, original edits and commentary. Test different hooks and keep the strongest format going.</footer>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <textarea id="modalText" readonly></textarea>
    <button onclick="copyText()" style="margin-top:10px">COPY SCRIPT</button>
  </div>
</div>

<script>
const plans=[
["1","clutch","1V4 CLUTCH","Squad dead… now it's MY game 😈","Show your best 1v4. Start with the danger, then cut rapidly between knocks.","\"Sab ne bola game khatam hai… lekin asli game ab shuru hui.\"","1v4 CLUTCH 🔥"],
["2","funny","THE PLAN FAILED","Confidence: 100%. Plan: 0%. 😂","Funny grenade, vehicle or unexpected fail. Freeze-frame the funniest moment.","\"Plan bilkul perfect tha… bas PUBG ne accept nahi kiya.\"","Tag your PUBG friend 😂"],
["3","clutch","1 HP SURVIVAL","1 HP… and they're still pushing 😳","Show low-health survival followed by the escape or comeback.","\"Mujhe laga yahin finish ho jaunga… phir ye hua.\"","HOW DID I SURVIVE?"],
["4","sniper","SNIPER ONLY","One shot. One chance. 🎯","Play a sniper-only round and show the cleanest shots with instant replays.","\"Aaj close-range nahi. Sirf sniper aur aim.\"","Rate the shot /10"],
["5","funny","LOOT FIRST 😂","Bro saw the loot and forgot the squad 💀","Capture a funny teammate loot moment and add quick subtitles.","\"Enemy baad mein… pehle loot!\"","Everyone has this teammate"],
["6","clutch","IMPOSSIBLE SHOT","That shot looked unreal 🔥","Long-range or moving-target shot. Slow down before impact, then replay full speed.","\"Ye shot miss hota to video khatam…\"","WATCH THE REPLAY"],
["7","challenge","PISTOL CHALLENGE","Can I survive using only a pistol?","Start with the challenge rule, then show the funniest and strongest moments.","\"Aaj rifle allowed nahi. Sirf pistol.\"","Challenge accepted?"],
["8","clutch","HOT DROP","No loot. No fear. Just fight.","Land at a busy location and cut straight to the first fight.","\"Landing ke baad loot ka time nahi mila…\"","HOT DROP 🔥"],
["9","sniper","MOVING TARGET","Moving enemy + sniper = pain 😭","Show one difficult moving shot with a clean zoom transition.","\"Target move kar raha tha… aim nahi.\"","Clean or lucky?"],
["10","funny","SQUAD CHAOS","4 players. 0 coordination. 😂","Use team voice/chat reactions if available and keep the funniest moments.","\"Squad mein sab leader hain… isi liye problem hai.\"","Your squad is like this?"],
["11","clutch","LAST MAN","Everyone is watching… pressure ON.","Show the final-player situation and build suspense before the last fight.","\"Ab revive nahi. Ab sirf clutch.\"","LAST MAN STANDING"],
["12","challenge","NO HEAL","Can I win without healing?","Play a match with no healing challenge and show damage moments.","\"Aaj medkit nahi. Jo hoga dekha jayega.\"","Would you try it?"],
["13","sniper","QUICK SCOPE","Fast scope. Clean finish. 🎯","Compile 3 quick-scope clips with beat-synced cuts.","\"Teen shots. Teen targets. Dekho aim.\"","Best one: 1, 2 or 3?"],
["14","funny","VEHICLE FAIL","When the vehicle becomes the enemy 😂","Use a funny driving/crash moment with a dramatic zoom.","\"Mujhe enemy se zyada gaari ne damage kiya.\"","PUBG physics 😂"],
["15","clutch","1V2 ENDGAME","Two enemies. One chance.","Show the final circle/endgame fight and replay the winning move.","\"Endgame mein sirf ek mistake allowed thi.\"","CLUTCH 🔥"],
["16","challenge","SHOTGUN ONLY","Close range only. Let's go.","Use shotgun only and highlight the best close-range fights.","\"Aaj distance nahi… sirf close combat.\"","SHOTGUN MODE"],
["17","funny","REVIVE ME BRO","Bro promised he would revive me… 😂","Show a teammate reaction or funny revive situation.","\"Bhai revive kar… BHAI?!\"","Tag the friend"],
["18","clutch","SILENT CLUTCH","No talking. Just gameplay.","Remove voiceover and let sound effects plus gameplay carry the clip.","\"Is clip ko bina voice ke dekho.\"","Headphones recommended 🎧"],
["19","sniper","LONG RANGE","How far can the shot go?","Show distance if visible, then the shot and replay.","\"Itna door target… aur sirf ek chance.\"","Distance? 🎯"],
["20","challenge","NO ARMOR","No armor, full confidence 😈","Play a short challenge segment and show how long you survive.","\"Armor nahi. Lekin confidence full.\"","Would you survive?"],
["21","clutch","SQUAD WIPE","Four enemies. One player.","Show a fast squad-wipe sequence with knock counters/text.","\"Ek ek karke sab saamne aa gaye.\"","SQUAD WIPE 🔥"],
["22","funny","WRONG BUTTON","That one button press ruined everything 💀","Use a genuine funny control mistake and replay it.","\"Mujhe laga main kuch aur press kar raha hoon…\"","Pain 😂"],
["23","sniper","HEADSHOT MONTAGE","Three clean shots in 15 seconds.","Create a rapid montage with a tiny pause before each impact.","\"Aaj sirf clean shots.\"","Which shot wins?"],
["24","challenge","MELEE ONLY","No guns. Can I survive?","Use melee gameplay where practical and focus on funny moments.","\"Aaj guns ko rest. 😭\"","MELEE MODE"],
["25","clutch","FINAL CIRCLE","One mistake = game over.","Build suspense with circle/positioning, then show the final fight.","\"Final circle mein heartbeat fast ho gayi…\"","FINAL CIRCLE 🔥"],
["26","funny","TEAMMATE AIM","When your teammate shoots everything except the enemy 😂","Use a harmless funny clip and subtitle the reactions.","\"Enemy saamne tha… bullets kahin aur ja rahi thin.\"","We all know one 😂"],
["27","challenge","RANDOM LOADOUT","Whatever the game gives me, I use it.","Show the random loadout at the start, then the best moments.","\"Aaj loadout main choose nahi karunga.\"","Lucky or unlucky?"],
["28","clutch","REVENGE","They knocked my teammate… big mistake.","Show the setup and your comeback, without overdoing the intro.","\"Unhon ne teammate ko knock kiya… ab meri turn.\"","REVENGE 🔥"],
["29","sniper","BEST SHOT","My cleanest shot of the month.","Use your strongest sniper clip with slow motion and replay.","\"Is shot ko main khud repeat nahi kar sakta.\"","BEST SHOT?"],
["30","challenge","30 DAY FINALE","30 days. One final montage. 🔥","Combine the strongest 6–8 moments from the month, ending on the best clip.","\"30 din ke clips… aur last wala sabse crazy hai.\"","NEXT MONTH? 🎮"]
];

const grid=document.getElementById("grid");
function render(type="all"){
 grid.innerHTML="";
 plans.forEach((p,i)=>{
   if(type!=="all" && p[1]!==type)return;
   const c=document.createElement("article");
   c.className="card"; c.style.animationDelay=(i*35)+"ms";
   c.dataset.type=p[1];
   c.innerHTML=`<div class="top"><span class="day">DAY ${p[0]}</span><span class="type">${p[1]}</span></div>
   <h2>${p[2]}</h2><div class="hook">“${p[3]}”</div>
   <div class="label">VIDEO IDEA</div><p>${p[4]}</p>
   <div class="label">VOICEOVER</div><p>${p[5]}</p>
   <div class="tags"><span class="tag">#PUBG</span><span class="tag">#Gaming</span><span class="tag">#TikTok</span></div>
   <div class="actions"><button onclick="openScript(${i})">SCRIPT</button><button onclick="copyCaption(${i})">COPY CAPTION</button></div>`;
   grid.appendChild(c);
 });
}
function filterCards(type,btn){document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render(type)}
function openScript(i){
 const p=plans[i]; document.getElementById("modalTitle").textContent=`DAY ${p[0]} • ${p[2]}`;
 document.getElementById("modalText").value=`HOOK:\n${p[3]}\n\nVIDEO IDEA:\n${p[4]}\n\nVOICEOVER:\n${p[5]}\n\nENDING/CAPTION:\n${p[6]}`;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function copyText(){navigator.clipboard.writeText(document.getElementById("modalText").value)}
function copyCaption(i){navigator.clipboard.writeText(`${plans[i][2]} | ${plans[i][6]}\n#PUBG #PUBGMobile #Gaming #TikTok`);alert("Caption copied!")}
render();
</script>
</body>
</html>
